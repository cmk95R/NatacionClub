    <!-- Pantalla de carga inicial (idéntica a la identidad visual del Login) -->

      </div>
      <h1 class="boot__title">Club de Natación</h1>
      <p class="boot__text">Cargando portal<span class="boot__dots"><span></span><span></span><span></span></span></p>
    </div>

    <style>
      #natacion-boot {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #f8fafc;
        font-family: 'Poppins', system-ui, -apple-system, sans-serif;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      body.app-ready #natacion-boot {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .boot__badge {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background-color: #e8eef7;
        border: 2px solid rgba(23, 52, 135, 0.15);
        display: flex;
        align-items: center;
        justify-content: center;
        animation: boot-wave 2s infinite ease-in-out;
        margin-bottom: 4px;
      }
      .boot__icon {
        width: 40px;
        height: 40px;
        animation: boot-bob 2s infinite ease-in-out;
      }
      .boot__title {
        margin: 0;
        font-size: 22px;
        font-weight: 800;
        color: #173487;
        letter-spacing: 0.5px;
      }
      .boot__text {
        margin: 0;
        font-size: 14px;
        font-weight: 500;
        color: #64748b;
        display: flex;
        align-items: baseline;
        gap: 3px;
      }
      .boot__dots span {
        display: inline-block;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #173487;
        margin-left: 2px;
        animation: boot-bounce 1.2s ease-in-out infinite;
      }
      .boot__dots span:nth-child(2) { animation-delay: 0.15s; }
      .boot__dots span:nth-child(3) { animation-delay: 0.3s; }

      @keyframes boot-wave {
        0% { transform: scale(0.96); box-shadow: 0 0 0 0 rgba(23, 52, 135, 0.35); }
        70% { transform: scale(1.04); box-shadow: 0 0 0 14px rgba(23, 52, 135, 0); }
        100% { transform: scale(0.96); box-shadow: 0 0 0 0 rgba(23, 52, 135, 0); }
      }
      @keyframes boot-bob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }
      @keyframes boot-bounce {
        0%, 80%, 100% { transform: translateY(0); opacity: 0.3; }
        40% { transform: translateY(-3px); opacity: 1; }
      }
    </style>

    <script type="module" src="/src/main.jsx"></script>
